name: Docs Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: docs-and-changelog
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create feature branch
        run: git checkout -b docs/auto-update-${{ github.run_id }}

      - name: Save baseline SHA
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot || { echo "::error::Copilot CLI installation failed on the runner."; exit 1; }

      - name: Run Copilot docs maintenance
        env:
          COPILOT_SHARE: ${{ github.workspace }}/.copilot-share
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p "$COPILOT_SHARE"
          copilot -p "$(cat .github/prompts/docs-maintainer.prompt.md)" \
            --allow-all-tools \
            --allow-tool='shell(git:*)' \
            --allow-tool=write \
            --deny-tool='write(src/*)' \
            --deny-tool='write(src/ui/*)' \
            --deny-tool='write(src/utils/*)' \
            --deny-tool='write(build.js)' \
            --deny-tool='write(pokevoid-unlocked.user.js)' \
            --deny-tool='write(.github/workflows/*)' \
            --deny-tool='write(CHANGELOG.md)' \
            --no-ask-user \
            --share="$COPILOT_SHARE/session.json" \
            2>&1 | tee copilot-docs.log

      - name: GUARD — revert any change on protected paths
        run: |
          git restore --staged -- src/ build.js pokevoid-unlocked.user.js .github/workflows/ 2>/dev/null || true
          git checkout -- src/ build.js pokevoid-unlocked.user.js .github/workflows/ 2>/dev/null || true
          git clean -fd -- src/ build.js pokevoid-unlocked.user.js .github/workflows/ 2>/dev/null || true

      - name: Verify no rogue commits
        run: |
          CURRENT=$(git rev-parse HEAD)
          if [ "$CURRENT" != "${{ steps.baseline.outputs.sha }}" ]; then
            echo "::error::Copilot committed changes to the branch — this is not allowed"
            exit 1
          fi

      - name: Ensure [Unreleased] block in CHANGELOG.md
        run: |
          python - <<'PYEOF'
          from pathlib import Path

          p = Path('CHANGELOG.md')
          header = '# Changelog'
          block = '## [Unreleased]\n<!-- auto-filled by CI -->'
          original = p.read_text(encoding='utf-8') if p.exists() else ''
          lines = original.splitlines()

          out = []
          i = 0
          while i < len(lines):
              if lines[i].startswith('## [Unreleased]'):
                  i += 1
                  while i < len(lines) and (
                      lines[i].startswith('<!-- auto-filled by CI -->') or lines[i].strip() == ''
                  ):
                      i += 1
                  continue
              out.append(lines[i])
              i += 1

          text = '\n'.join(out).strip('\n')
          if text.startswith(header):
              rest = text[len(header):].lstrip('\n')
              new = header + '\n\n' + block + '\n\n' + rest + '\n'
          else:
              new = header + '\n\n' + block + '\n\n' + text + '\n'

          if new != original:
              p.write_text(new, encoding='utf-8')
          PYEOF

      - name: Detect docs changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- README.md CHANGELOG.md LICENSE docs .github/copilot-instructions.md .github/prompts)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit docs changes
        id: commit
        if: steps.changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: auto-update via GitHub Copilot [CI]'
          file_pattern: 'README.md CHANGELOG.md LICENSE docs/** .github/copilot-instructions.md .github/prompts/**'

      - name: Open documentation PR
        if: steps.commit.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: docs/auto-update-${{ github.run_id }}
          base: master
          title: 'docs: auto-update via GitHub Copilot'
          body: |
            Automated documentation update generated by the GitHub Copilot CLI.

            - Trigger: `${{ github.event_name }}`
            - Full log: see the `copilot-docs-log` artifact of this run.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Copilot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copilot-docs-log
          path: copilot-docs.log